# Note: This file is not to be installed on the k8s cluster. This is a NGINX config file that can be used to have a NGINX proxy in-front-of your K8S cluster to proxy http(s) traffic.
# I've registered my K8S SVC ip in my IDM DNS so I just need the server_name to resolve. For others, you can just put the K8S SVC IP in the server_name value.
server {
    listen 80;
    server_name headlamp.lab.sanderson.com;

    location / {
        # Forward the requests to the container on host port 8080
        proxy_pass http://headlamp.lab.sanderson.com:8080;

        # Standard headers to preserve the client's original request details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Support WebSockets if your container uses them
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name headlamp.lab.sanderson.com;

    # SSL Certificate Paths (Update these to match your certificate paths)
    ssl_certificate /etc/nginx/certs/headlamp.crt;
    ssl_certificate_key /etc/nginx/certs/headlamp.key;

    # Recommended Security Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy Configuration
    location / {
        # Change this to your app's actual backend port or container name
        proxy_pass http://headlamp.lab.sanderson.com:8080;

        # Forward Essential Client Headers (Crucial for apps to know real visitor info)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Optional, uncomment if your app uses WebSockets)
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
